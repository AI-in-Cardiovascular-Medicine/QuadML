site_name: QuadML
site_description: A point-and-click machine learning framework for classification, regression, survival analysis, and clustering.
site_url: https://ai-in-cardiovascular-medicine.github.io/QuadML/
repo_url: https://github.com/AI-in-Cardiovascular-Medicine/QuadML
repo_name: AI-in-Cardiovascular-Medicine/QuadML

# Developer notes are kept in the repo but not published on the docs site.
exclude_docs: |
  developer-notes/

theme:
  name: material
  # Use local/system fonts (Times New Roman via extra.css), not Google Fonts.
  font: false
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Introduction: getting-started/00-overview.md
      - System requirements: getting-started/01-system-requirements.md
      - Install from source: getting-started/02-install-from-source.md
      - Install Windows executable: getting-started/03-install-windows-exe.md
      - macOS notes: getting-started/04-macos-notes.md
      - First run: getting-started/05-first-run.md
      - Python requirements: getting-started/06-python-requirements.md
      - Prepare the data: getting-started/07-prepare-the-data.md
      - Troubleshooting: getting-started/08-troubleshooting.md
      - Build and package: getting-started/09-build-and-package.md
      - About: getting-started/10-about.md
      - Quick start walkthrough: getting-started/walkthrough.md
  - Classification:
