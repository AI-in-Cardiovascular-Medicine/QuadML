site_name: QuadML
site_description: A point-and-click machine learning framework for classification, regression, survival analysis, and clustering.
site_url: https://ai-in-cardiovascular-medicine.github.io/QuadML/
repo_url: https://github.com/AI-in-Cardiovascular-Medicine/QuadML
repo_name: AI-in-Cardiovascular-Medicine/QuadML

# Developer notes and snippet sources are not published as standalone pages.
exclude_docs: |
  developer-notes/
  _snippets/

theme:
  name: material
  # Use local/system fonts (Arial via extra.css), not Google Fonts.
  font: false
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Troubleshooting: getting-started/08-troubleshooting.md
  - Classification:
      - Overview: classification/00-introduction.md
      - Pipeline:
          - File selection: classification/01-file-selection.md
          - Data cleaning: classification/02-data-cleaning.md
          - Imputation: classification/03-imputation.md
          - Scaling: classification/04-scaling.md
          - Feature selection: classification/05-feature-selection.md
          - Dimensionality reduction: classification/06-dimensionality-reduction.md
          - Classifiers: classification/07-classifiers.md
          - Data splitting: classification/08-data-splitting.md
          - Parameter tuning: classification/09-parameter-tuning.md
      - Results:
          - Metrics: classification/10-results.md
          - Visualization: classification/11-visualization.md
          - Interpretability: classification/12-interpretability.md
  - Regression:
      - Overview: regression/00-introduction.md
      - Pipeline:
          - File selection: regression/01-file-selection.md
          - Data cleaning: regression/02-data-cleaning.md
          - Imputation: regression/03-imputation.md
          - Scaling: regression/04-scaling.md
          - Feature selection: regression/05-feature-selection.md
          - Dimensionality reduction: regression/06-dimensionality-reduction.md
          - Regressors: regression/07-regressors.md
          - Data splitting: regression/08-data-splitting.md
          - Parameter tuning: regression/09-parameter-tuning.md
      - Results:
          - Metrics: regression/10-results.md
          - Visualization: regression/11-visualization.md
          - Interpretability: regression/12-interpretability.md
  - Survival analysis:
      - Overview: survival/00-introduction.md
      - Pipeline:
          - File selection: survival/01-file-selection.md
          - Data cleaning: survival/02-data-cleaning.md
          - Imputation: survival/03-imputation.md
          - Scaling: survival/04-scaling.md
          - Feature selection: survival/05-feature-selection.md
          - Dimensionality reduction: survival/06-dimensionality-reduction.md
          - Descriptive analysis: survival/07-descriptive-analysis.md
          - Models: survival/08-survival-models.md
          - Data splitting: survival/09-data-splitting.md
          - Parameter tuning: survival/10-parameter-tuning.md
      - Results:
          - Metrics: survival/11-results.md
          - Visualization: survival/12-visualization.md
          - Interpretability: survival/13-interpretability.md
  - Clustering:
      - Overview: clustering/00-introduction.md
      - Pipeline:
          - File selection: clustering/01-file-selection.md
          - Data cleaning: clustering/02-data-cleaning.md
          - Imputation: clustering/03-imputation.md
          - Scaling: clustering/04-scaling.md
          - Feature selection: clustering/05-feature-selection.md
          - Dimensionality reduction: clustering/06-dimensionality-reduction.md
          - Models: clustering/07-clustering-models.md
          - Search settings: clustering/08-search-settings.md
      - Results:
          - Metrics: clustering/09-results.md
          - Visualization: clustering/10-visualization.md
  - About:
      - About QuadML: getting-started/10-about.md
      - Changelog: about/changelog.md
  - For developers:
      - Code structure: developers/code-structure.md
      - Search and Start Procedure: developers/search-and-start-procedure.md
      - Python requirements: developers/python-requirements.md
      - Build and package: developers/build-and-package.md
      - Contributing: developers/contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  version: "1.0"
